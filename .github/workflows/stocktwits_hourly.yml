name: StockTwits Hourly Summary

on:
  schedule:
    # Runs at the top of every hour, 9 AM - 8 PM ET (13:00-00:00 UTC during EDT).
    # Adjust hours if you want 24/7 coverage or different market hours.
    - cron: "0 13-23 * * 1-5"
    - cron: "0 0 * * 2-6"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed to commit the updated last_seen_id.json state file

jobs:
  run-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run StockTwits summary script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python stocktwits_hourly.py

      - name: Commit updated state file
        run: |
          git config user.name "stocktwits-bot"
          git config user.email "actions@github.com"
          git add last_seen_id.json
          git diff --staged --quiet || git commit -m "Update last_seen_id [skip ci]"
          git push
