name: StockTwits Summary Email

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours = 6x/day (8 AM, 12 PM, 4 PM, 8 PM, 12 AM, 4 AM ET during EDT)
  workflow_dispatch:        # manual run sends immediately

jobs:
  email-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch chartistmind and momobull messages and email summary
        env:
          STOCKTWITS_ACCESS_TOKEN: ${{ secrets.STOCKTWITS_ACCESS_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python stocktwits_multi_email.py
