name: StockTwits Daily Email Summary

on:
  schedule:
    - cron: '0 2 * * *'   # 10:00 PM ET when the US is on EDT
    - cron: '0 3 * * *'   # 10:00 PM ET when the US is on EST
  workflow_dispatch:      # manual test run (always sends)

jobs:
  email-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch chartistmind messages and email summary
        env:
          STOCKTWITS_ACCESS_TOKEN: ${{ secrets.STOCKTWITS_ACCESS_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python stocktwits_daily_email.py
